<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>행렬 곱셈 알고리즘 수련</title>
    <script>
      function solution(arr1, arr2) {
        // [준비 단계] 행렬의 크기 파악
        const row1 = arr1.length; // 첫 번째 행렬의 행 개수
        const col2 = arr2[0].length; // 두 번째 행렬의 열 개수
        const col1 = arr1[0].length; // 공통 차원 (arr1의 열이자 arr2의 행)

        // [방법 1] Array.from을 이용한 결과 행렬 초기화 (row1 x col2)
        const matrix = Array.from(Array(row1), () => new Array(col2).fill(0));

        /*
      [참고: 고전적인 행렬 초기화 방식]
      const ret = [];
      for(let i = 0; i < row1; i++){
        ret.push(new Array(col2).fill(0));
      }
      */

        /*
      [참고: 고차 함수(map, reduce)를 이용한 현대적 구현 방식]
      function solution(arr1, arr2) {
        // 1. arr1의 각 행(row)을 순회
        return arr1.map((row) => {
          // 2. arr2[0]의 열(column) 개수만큼 새로운 요소 생성
          return arr2[0].map((_, i) => {
            // 3. 행렬 곱셈의 핵심: 내적(dot product) 계산
            return row.reduce((acc, cur, j) => acc + cur * arr2[j][i], 0);
          });
        });
      }
      */

        // [연산 단계] 3중 반복문을 이용한 행렬 곱 수행
        for (let i = 0; i < row1; i++) {
          for (let j = 0; j < col2; j++) {
            for (let k = 0; k < col1; k++) {
              // matrix[i][j]는 arr1의 i번째 행과 arr2의 j번째 열의 곱들의 합
              matrix[i][j] += arr1[i][k] * arr2[k][j];
            }
          }
        }

        return matrix;
      }

      // --- 실행 예시 1 ---
      const arr1 = [
        [1, 4],
        [3, 2],
        [4, 1],
      ];
      const arr2 = [
        [3, 3],
        [3, 3],
      ];
      console.log("결과 1:", solution(arr1, arr2));

      // --- 실행 예시 2 ---
      const arr3 = [
        [2, 3, 2],
        [4, 2, 4],
        [3, 1, 4],
      ];
      const arr4 = [
        [5, 4, 3],
        [2, 4, 1],
        [3, 1, 1],
      ];
      console.log("결과 2:", solution(arr3, arr4));
    </script>
  </head>
  <body>
    <p>
      결과는 브라우저 개발자 도구(F12)의 Console 탭에서 확인하실 수 있습니다.
    </p>
  </body>
</html>
