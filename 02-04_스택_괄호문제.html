<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>괄호 검사기</title>
  </head>
  <body>
    <script>
      function solution(Parentheses) {
        const stack = [];

        for (const ele of Parentheses) {
          if (ele === "(") {
            stack.push("(");
          } else if (ele === ")") {
            // 짝을 맞출 여는 괄호가 없다면 즉시 실패로 간주합니다.
            if (stack.pop() === undefined) return false;
          }
        }

        // 모든 짝이 맞았다면 스택은 비어 있어야 합니다.
        return stack.length === 0;
      }

      // 결과 확인
      console.log(solution("(())()")); // 결과: true
      console.log(solution("(()")); // 결과: false
    </script>
  </body>
</html>
