<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>괄호 회전하기</title>
  <script>
    function solution(s) {
      // 기초 정찰: 길이가 홀수라면 절대 짝이 맞을 수 없으므로 종료
      if (s.length % 2 !== 0) return 0;

      let count = 0;
      let currentS = s; // 원본 훼손 방지를 위해 변수 사용

      for (let i = 0; i < s.length; i++) {
        const stack = [];
        let isValid = true; // 이번 회전이 올바른지 체크하는 깃발

        for (const char of currentS) {
          if (char === '(' || char === '[' || char === '{') {
            stack.push(char);
          } else {
            // 닫는 괄호가 나왔는데 스택이 비어있으면 즉시 실패
            if (stack.length === 0) {
              isValid = false;
              break;
            }

            const top = stack.pop();
            // 꺼낸 열린 괄호와 현재의 닫힌 괄호가 짝이 맞지 않으면 실패
            if (
              (char === ')' && top !== '(') ||
              (char === ']' && top !== '[') ||
              (char === '}' && top !== '{')
            ) {
              isValid = false;
              break;
            }
          }
        }

        // 모든 글자를 확인했을 때, 중간에 실패하지 않았고 스택이 완전히 비어있어야 성공
        if (isValid && stack.length === 0) {
          count++;
        }

        // 문자열 회전: 첫 글자를 가장 뒤로 보냄
        currentS = currentS.slice(1) + currentS.slice(0, 1);
      }

      return count;
    }

    // 검증을 위한 출력
    console.log("결과값:", solution('({})')); 
  </script>
</head>
<body>
  <h1>브라우저 콘솔(F12)을 확인하십시오.</h1>
</body>
</html>
