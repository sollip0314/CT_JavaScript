<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주식 가격 분석</title>
    <script>
      function solution(prices) {
        // 결과를 저장할 배열을 0으로 초기화
        const score = new Array(prices.length).fill(0);

        for (let i = 0; i < prices.length; i++) {
          // 현재 시점(i) 이후의 가격들을 비교
          for (let j = i + 1; j < prices.length; j++) {
            // 일단 1초가 지났으므로 기간을 증가
            score[i]++;

            // 만약 가격이 떨어졌다면(현재 가격 > 비교 가격) 탐색 중단
            if (prices[i] > prices[j]) {
              break;
            }
          }
        }

        console.log(score);
        return score; // 각 시점별 가격 유지 시간 반환
      }

      // 실행 예시: [1, 2, 3, 2, 3] -> 결과: [4, 3, 1, 1, 0]
      solution([1, 2, 3, 2, 3]);
    </script>
  </head>
  <body></body>
</html>
