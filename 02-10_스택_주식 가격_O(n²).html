<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function solution(prices) {
        const score = new Array(prices.length).fill(0);

        for (let i = 0; i < prices.length; i++) {
          for (let j = i + 1; j < prices.length; j++) {
            score[i]++;
            if (prices[i] > prices[j]) {
              break;
            }
          }
        }

        console.log(score);
        return score; // 함수의 결과값을 반환
      }
      solution([1, 2, 3, 2, 3]);
    </script>
  </head>
  <body></body>
</html>
