<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function solution(str) {
        const stack = [];

        for (let char of str) {
          // 스택의 꼭대기(마지막 값)와 현재 문자가 같다면 짝이 맞으므로 제거
          if (stack.length > 0 && stack[stack.length - 1] === char) {
            stack.pop();
          } else {
            // 짝이 아니면 일단 스택에 저장
            stack.push(char);
          }
        }

        // 최종적으로 스택이 비어있으면 모든 짝이 맞은 것(1), 남아있으면 실패(0)
        return stack.length === 0 ? 1 : 0;
      }
    </script>
  </head>
  <body></body>
</html>
