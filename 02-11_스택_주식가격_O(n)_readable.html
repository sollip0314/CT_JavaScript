<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>

    <script>
      /**
       * 주식 가격 유지 기간 계산 (Stack 활용 전략)
       * 시간 복잡도: O(N) - 모든 가격은 스택에 한 번 들어갔다 한 번 나옵니다.
       */
      function solution(prices) {
        // arr: 가격이 떨어지기를 기다리는 '대기소'(스택)
        const arr = [];
        // result: 시점별 결과를 임시 저장할 저장소
        const result = [];

        for (let i = 0; i < prices.length; i++) {
          /**
           * [하락장 포착 및 정산]
           * 대기소의 마지막 가격보다 현재 가격(prices[i])이 낮다면 하락으로 판단.
           * 하락 조건이 만족하는 동안 스택에서 과거 병사들을 꺼내어 기간을 계산합니다.
           */
          while (arr.length > 0 && arr[arr.length - 1].value > prices[i]) {
            console.log("하락 포착:");
            const temp = arr.pop(); // 안전하게 데이터 추출

            // 유지 시간 = 현재 시점(i) - 대기소에 투입된 시점(temp.index)
            result.push({ index: temp.index, value: i - temp.index });
          }

          // 현재 시점의 가격 정보를 대기소에 추가
          arr.push({ index: i, value: prices[i] });
        }

        /**
         * [잔적 정산: 끝까지 하락하지 않은 경우]
         * 루프가 종료된 후에도 대기소에 남은 이들은 마지막까지 버틴 승리자들입니다.
         */
        while (arr.length > 0) {
          const temp = arr.pop();

          // 마지막 지점(prices.length - 1)까지 버틴 시간을 정산
          const time = prices.length - temp.index - 1;
          result.push({ index: temp.index, value: time });
        }

        // 1. 대열 정비: 하락 시점순으로 쌓인 결과를 원래의 인덱스 순서대로 정렬
        result.sort((a, b) => {
          return a.index - b.index;
        });

        // 2. 최종 보고: 객체에서 시간(value)만 추출하여 반환
        return result.map((item) => item.value);
      }

      // 실행 예시: [1, 2, 3, 1, 2] -> 결과: [4, 3, 1, 1, 0]
      console.log(solution([1, 2, 3, 1, 2]));
    </script>
  </head>

  <body></body>
</html>
