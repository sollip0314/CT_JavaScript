<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const board = [
        [0, 0, 0, 0, 0],
        [0, 0, 1, 0, 3],
        [0, 2, 5, 0, 1],
        [4, 2, 4, 4, 2],
        [3, 5, 1, 3, 1],
      ];

      const moves = [1, 5, 3, 5, 1, 2, 1, 4];

      function solution(board, moves) {
        const N = board.length;
        let disappearedCount = 0;
        const basket = [];

        // 1. 각 열의 "인형 위치"를 가리키는 포인터(Top Index)를 미리 찾지 않고,
        //    현장에서 즉시 추출하되 바구니 연산에 집중합니다.
        for (const move of moves) {
          const col = move - 1; // 크레인이 멈춘 열(0-index)

          // 2. 해당 열에서 가장 위에 있는 인형 찾기
          for (let row = 0; row < N; row++) {
            if (board[row][col] !== 0) {
              const doll = board[row][col];
              board[row][col] = 0; // 인형을 꺼냈으므로 빈칸 처리

              // 3. 바구니 판정(Stack 자료구조 활용)
              if (basket.length > 0 && basket[basket.length - 1] == doll) {
                basket.pop();
                disappearedCount += 2;
              } else {
                basket.push(doll);
              }

              // 인형 하나 집었으므로 다음 move로 넘어감
              break;
            }
          }
        }

        return disappearedCount;
      }
    </script>
  </head>
  <script></script>
  <body></body>
</html>
