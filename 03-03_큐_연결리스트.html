<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      class Node {
        constructor(data) {
          this.data = data; // 요소의 값
          this.next = null; // 다음 요소를 참조
        }
      }

      class Queue {
        constructor() {
          this.head = null; // 첫 번째 요소 참조
          this.tail = null; // 마지막 요소 참조
          this.size = 0; // 큐의 길이
        }

        push(data) {
          // 새로운 요소를 생성
          const newNode = new Node(data);

          // 큐가 비어 있다면 head와 tail을 모두 새로 생성한 요소를 가리키게 한다
          if (!this.head) {
            this.head = newNode;
            this.tail = newNode;
          } else {
            this.tail.next = newNode; // 큐가 가리키는 마지막 노드가 newNode를 가리키게 함
            this.tail = newNode; // 큐가 가리키는 마지막 노드를 newNode를 가리키게 함
          }

          this.size++; // 큐 길이 증가
        }

        pop() {
          // head가 null이면 비어 있다는 뜻
          if (!this.head) {
            return null;
          }

          // 두 번째 요소를 head의 참조로 변경하면
          // 자연스럽게 첫 번째 요소가 사라짐
          const removeNode = this.head;
          this.head = this.head.next;

          // 큐가 가리키는 링크드리스트의 node가 하나 뿐인 상태에 위에서 pop을 한 경우
          // 다시 말해 위에서 this.head.next가 null인 경우
          if (!this.head) {
            this.tail = null;
          }

          this.size--; // 큐 길이 감소

          // 삭제된 요소의 값을 반환
          return removeNode.data;
        }

        isEmpty() {
          return this.size === 0;
        }
      }
    </script>
  </head>
  <body></body>
</html>
