<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      class Node {
        constructor(data) {
          this.data = data;
          this.next = null;
        }
      }

      class Queue {
        constructor() {
          this.head = null;
          this.tail = null;
          this.gijun = null;
          this.size = 0;
        }

        push(data) {
          // 1. 클래스 호출 시 'new' 키워드 필요
          const newNode = new Node(data);

          if (!this.head) {
            this.head = newNode;
            this.tail = newNode;
            this.gijun = newNode;
          } else {
            this.tail.next = newNode;
            this.tail = newNode;
          }

          this.size++;
        }

        del(k) {
          if (this.size === 0) return;

          // 1. 영점 조절 (while문 밖에서 단 한번)
          this.gijun = this.tail;

          // 2. 완전한 원형 진법 구축 (꼬리의 다음을 머리로 연결)
          this.tail.next = this.head;

          while (this.size !== 1) {
            // 3. K-1번 전진 (이제 null 걱정 없이 무한 회전 가능)
            for (let i = 1; i < k; i++) {
              this.gijun = this.gijun.next;
            }

            // 4. 타겟 포착 및 제거
            let target = this.gijun.next;

            // 만약 지워지는 놈이 head였다면, 지휘소(head) 위치만 옮겨줍니다.
            if (target === this.head) {
              this.head = target.next;
            }
            // 만약 지워지는 놈이 tail이었다면, 꼬리 위치를 옮겨줍니다.
            if (target === this.tail) {
              this.tail = this.gijun;
            }

            // 연결 끊기 (삭제)
            this.gijun.next = target.next;

            // 다음 작전을 위해 기준점을 삭제된 놈 다음으로 이동
            //this.gijun = this.gijun.next;

            this.size--;
          }
          console.log("최후의 생존자:", this.head.data);
        }
      }

      function solution(N, K) {
        // 큐 생성
        const queue = new Queue();

        // N개의 노드 생성
        for (let i = 1; i <= N; i++) {
          queue.push(i);
        }

        queue.del(K);
      }

      solution(6, 5);
    </script>
  </head>
  <body></body>
</html>
