<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      class Queue {
        items = [];
        front = 0;
        rear = 0;

        push(item) {
          this.items.push(item);
          this.rear++;
        }

        // 이 문제에서는 큐의 크기를 알아야 한다.
        size() {
          return this.rear - this.front;
        }

        pop() {
          return this.items[this.front++];
        }
      }

      function solution(N, K) {
        const queue = new Queue();

        // 1부터 N까지의 번호를 queue에 추가
        for (let i = 1; i <= N; i++) {
          queue.push(i);
        }

        while (queue.size() > 1) {
          for (let i = 1; i < K; i++) {
            // K-1번만큼 앞에서 빼서 뒤로 보냄 (순환)
            queue.push(queue.pop());
          }
          // K번째 요소 제거
          queue.pop();
        }

        return queue.pop();
      }

      console.log(solution(5, 2));
    </script>
  </head>
  <body></body>
</html>
